name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/m1r3dk/dirhop/internal/version"
          LDFLAGS="-s -w -X ${PKG}.version=${VERSION} -X ${PKG}.commit=${COMMIT} -X ${PKG}.date=${DATE}"
          mkdir -p dist
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for p in $platforms; do
            os="${p%/*}"; arch="${p#*/}"
            out="dirhop"
            [ "$os" = "windows" ] && out="dirhop.exe"
            echo "building $os/$arch"
            env GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/dirhop
            if [ "$os" = "windows" ]; then
              zip -q "dist/dirhop_${VERSION}_${os}_${arch}.zip" "$out"
            else
              tar -czf "dist/dirhop_${VERSION}_${os}_${arch}.tar.gz" "$out"
            fi
            rm -f "$out"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
