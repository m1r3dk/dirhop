name: Bug report
description: Report a problem with dirhop
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not include private
        bucket lists, API keys, or other secrets. For security issues, follow
        SECURITY.md instead of opening a public issue.
  - type: checkboxes
    id: ethical
    attributes:
      label: Ethical use
      options:
        - label: I am using dirhop for ethical purposes only.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and any (redacted) output or error.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: dirhop version / commit
      placeholder: e.g. v0.1.0 or git SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: e.g. macOS 14 arm64, Ubuntu 24.04 amd64, Windows 11 amd64
    validations:
      required: true
