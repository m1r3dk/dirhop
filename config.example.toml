# dirhop configuration (TOML-style key/value subset)
crawl_concurrency = 8
download_workers = 4
http_timeout = "30s"
busy_timeout = "5s"
retries = 3
download_directory = "downloads"
metadata = "normal"
color = true
user_agent = "dirhop/1"

# GrayHatWarfare public-bucket search (the `ghw` command). Get a key at
# https://grayhatwarfare.com/. Prefer the GRAYHATWARFARE_API_KEY environment
# variable so the key is not stored on disk; it overrides this value.
# grayhatwarfare_api_key = ""
